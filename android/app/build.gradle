plugins {
    id 'com.android.application'
}

android {
    namespace 'com.m5dev.fminfinite'
    compileSdk 35

    defaultConfig {
        applicationId "com.m5dev.fminfinite"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        force 'androidx.core:core:1.13.0'
        force 'androidx.activity:activity:1.9.0'
        force 'androidx.fragment:fragment:1.8.0'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.core:core:1.13.0'
    
    // Force all kotlin stdlib to same version to avoid duplicates
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
        because 'Align kotlin stdlib versions'
    }
    implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
        because 'Align kotlin stdlib versions'
    }
}
