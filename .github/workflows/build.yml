name: Build FM Infinite APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;25.2.9519653"

      - name: Install CMake
        run: sdkmanager "cmake;3.22.1"

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fm-infinite-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fm-infinite-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      # Stable release on version tag (v*)
      - name: Create Stable Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          name: "FM Infinite ${{ github.ref_name }}"
          body: |
            🎮 FM Infinite - FM Towns Emulator for Android

            ### Stable Release ${{ github.ref_name }}
            This is a stable release built from tag `${{ github.ref_name }}`.

            ### Files
            | File | Description |
            |------|-------------|
            | `app-debug.apk` | Debug build with symbols |
            | `app-release-unsigned.apk` | Release build (unsigned) |

            ### Requirements
            - Android 7.0+ (API 24)
            - FM Towns BIOS files (not included)
            - Game disc images (ISO, MDS, or CHD)

            ### Installation
            1. Download the APK
            2. Enable "Install from unknown sources" in Android settings
            3. Place BIOS files in `bios/` folder on first launch
            4. Launch and enjoy! 🕹️

            ### Links
            - [Full Documentation](https://github.com/${{ github.repository }}/blob/main/README.md)
            - [Report Issues](https://github.com/${{ github.repository }}/issues)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Nightly release on every push to main/master
      - name: Delete Old Nightly Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: dev-drprasad/delete-tag-and-release@v1.0
        with:
          tag_name: nightly
          delete_release: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create Nightly Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          tag_name: nightly
          name: "FM Infinite Nightly"
          body: |
            🌙 FM Infinite - Nightly Build

            This is an automated nightly build from the `main` branch.
            **Warning:** This build may contain unstable features or bugs.

            ### Build Info
            - **Commit:** ${{ github.sha }}
            - **Date:** ${{ github.event.head_commit.timestamp }}
            - **Branch:** ${{ github.ref_name }}

            ### Files
            | File | Description |
            |------|-------------|
            | `app-debug.apk` | Debug build with symbols |
            | `app-release-unsigned.apk` | Release build (unsigned) |

            ### Requirements
            - Android 7.0+ (API 24)
            - FM Towns BIOS files (not included)
            - Game disc images (ISO, MDS, or CHD)

            ### Installation
            1. Download the APK
            2. Enable "Install from unknown sources" in Android settings
            3. Place BIOS files in `bios/` folder on first launch
            4. Launch and enjoy! 🕹️

            ### Links
            - [Stable Releases](https://github.com/${{ github.repository }}/releases)
            - [Report Issues](https://github.com/${{ github.repository }}/issues)
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
